name: CI

on:
  push:
  pull_request:

jobs:
  bundle:
    name: Install and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Bundle the JavaScript for Android
        run: npx expo export --platform android --output-dir dist
